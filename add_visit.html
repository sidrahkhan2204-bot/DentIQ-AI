{% extends 'base.html' %}
{% block title %}Add Visit — DentIQ{% endblock %}
{% block page_title %}Add Clinical Visit{% endblock %}

{% block content %}

<p style="color:var(--text-secondary); margin:0 0 20px 0;">
    Patient: <strong>{{ profile.patient_id }}</strong> — {{ profile.user.name }}
</p>

<div class="custom-card">
    <form method="POST" action="{% url 'add_visit' profile.patient_id %}">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Reason for Visit</label>
            <input type="text" name="reason" class="form-control" placeholder="e.g. Routine checkup, toothache">
        </div>

        <div class="mb-3">
            <label class="form-label">Chief Complaint</label>
            <textarea name="chief_complaint" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Examination Findings</label>
            <textarea name="examination_findings" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Diagnosis</label>
            <textarea name="diagnosis" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Treatment Plan</label>
            <textarea name="treatment_plan" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Follow-up Date</label>
            <input type="date" name="follow_up_date" class="form-control">
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-accent"><i class="fas fa-save"></i> Save Visit</button>
            <a href="{% url 'patient_file' profile.patient_id %}" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
