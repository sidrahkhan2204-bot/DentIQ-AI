{% extends 'base.html' %}
{% block title %}Upload Document — DentIQ{% endblock %}
{% block page_title %}Upload Patient Document{% endblock %}

{% block content %}

<p style="color:var(--text-secondary); margin:0 0 20px 0;">
    Patient: <strong>{{ profile.patient_id }}</strong> — {{ profile.user.name }}
</p>

<div class="custom-card" style="max-width:640px;">
    <form method="POST" action="{% url 'upload_patient_document' profile.patient_id %}" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Document Type</label>
            <select name="doc_type" class="form-select" required>
                <option value="xray">X-Ray</option>
                <option value="lab">Lab Report</option>
                <option value="consent">Consent Form</option>
                <option value="photo">Clinical Photo</option>
                <option value="report">Report</option>
                <option value="other">Other</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" required placeholder="e.g. Panoramic X-ray Jan 2026">
        </div>

        <div class="mb-3">
            <label class="form-label">File</label>
            <input type="file" name="file" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2"></textarea>
        </div>

        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn-accent"><i class="fas fa-upload"></i> Upload</button>
            <a href="{% url 'patient_file' profile.patient_id %}" class="btn-outline">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
